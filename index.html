<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Stream</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg:#0e0e10; --header:#18181b; --txt:#efeff1; --hint:#adadb8; --accent:#9147ff; --red:#eb0400; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',-apple-system,BlinkMacSystemFont,'Roboto',sans-serif; }
        body { background:var(--bg); color:var(--txt); height:100vh; overflow:hidden; display:flex; flex-direction:column; }
        
        .video-wrapper { position:relative; width:100%; background:#000; flex:1; min-height:50vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
        video { width:100%; height:100%; object-fit:fill; display:none; } 
        
        .overlay-screen { position:absolute; inset:0; background:rgba(14,14,16,0.98); backdrop-filter:blur(15px); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:50; text-align:center; padding:20px; transition:opacity .3s; }
        
        .pay-btn { display:block; width:100%; max-width:280px; padding:14px 24px; border-radius:6px; font-size:14px; font-weight:700; text-decoration:none; text-align:center; margin-top:12px; cursor:pointer; border:none; transition:transform .1s; }
        .pay-btn.primary { background:var(--accent); color:white; box-shadow:0 4px 15px rgba(145,71,255,.4); }
        .pay-btn.secondary { background:transparent; color:var(--hint); border:1px solid rgba(255,255,255,.15); font-weight:600; font-size:13px; margin-top:8px; }
        .pay-btn:hover { transform:translateY(-1px); opacity:.9; }
        
        .title { font-size:20px; font-weight:bold; margin-bottom:8px; }
        .desc { color:var(--hint); font-size:13px; max-width:280px; line-height:1.4; margin-bottom:12px; }
        
        .session-display { background:rgba(255,255,255,.05); padding:10px 16px; border-radius:6px; margin:12px 0; font-family:monospace; font-size:14px; color:var(--accent); word-break:break-all; user-select:all; cursor:pointer; border:1px dashed rgba(145,71,255,.3); }
        
        .top-overlay { position:absolute; top:16px; left:16px; pointer-events:none; z-index:10; opacity:0; transition:opacity .5s; }
        .badge { padding:4px 8px; border-radius:4px; font-size:12px; font-weight:700; text-transform:uppercase; background:var(--red); color:white; }
        
        .chat-container { height:45%; background:var(--bg); display:flex; flex-direction:column; border-top:1px solid rgba(255,255,255,.05); flex-shrink:0; }
        .chat-header { padding:12px 16px; background:var(--header); font-size:13px; font-weight:600; color:var(--txt); border-bottom:1px solid rgba(255,255,255,.05); display:flex; justify-content:space-between; align-items:center; }
        .chat-messages { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:6px; mask-image:linear-gradient(to bottom,transparent,black 10%); }
        .msg { font-size:13px; line-height:1.4; word-wrap:break-word; animation:fadeIn .3s ease; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
        .name { font-weight:600; margin-right:4px; color:var(--accent); }
        
        .input-area { padding:10px 16px; background:var(--header); display:flex; flex-direction:column; gap:8px; }
        .row { display:flex; gap:8px; }
        input { background:var(--bg); border:1px solid rgba(255,255,255,.1); color:white; padding:8px 12px; border-radius:4px; font-size:13px; outline:none; }
        .nick-in { width:100%; background:transparent; border:none; color:var(--hint); font-size:12px; border-bottom:1px solid rgba(255,255,255,.05); padding:4px 12px; }
        .send-btn { background:var(--accent); color:white; border:none; width:32px; height:32px; border-radius:4px; cursor:pointer; font-weight:bold; }
        
        .error-msg { position:absolute; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(235,4,0,0.9); color:white; padding:8px 16px; border-radius:4px; font-size:12px; display:none; z-index:100; text-align:center; }
        
        @media(min-width:768px){ 
            body{flex-direction:row} 
            .video-wrapper{height:100vh;width:70%;max-width:1000px} 
            .chat-container{height:100vh;width:30%;min-width:300px;max-width:400px;border-top:none;border-left:1px solid rgba(255,255,255,.05)} 
            video{object-fit:contain} 
        }
    </style>
</head>
<body>
    <div class="video-wrapper">
        <!-- ТВОЯ ССЫЛКА НА BUNNY.NET УЖЕ ВСТАВЛЕНА -->
        <video id="streamVideo" playsinline loop muted crossorigin="anonymous"></video>
        
        <div class="overlay-screen" id="startScreen">
            <div class="title">🔴 Private Stream</div>
            <div class="desc">Welcome! You have 30 seconds of free preview.</div>
            <button class="pay-btn primary" onclick="joinStream()">▶ Join Stream</button>
        </div>

        <div class="overlay-screen" id="paywallScreen" style="display:none;">
            <div class="title">🔒 Private Access Required</div>
            <div class="desc">Free preview ended. Pay below or send this ID to my Telegram to continue.</div>
            
            <div class="session-display" onclick="copySessionId()">
                📋 <span id="displaySessionId"></span>
            </div>
            
            <!-- ЗАМЕНИ ССЫЛКИ НИЖЕ НА СВОИ -->
            <a href="#" class="pay-btn primary" id="payLink" target="_blank">💎 Pay 400₽</a>
            <a href="#" class="pay-btn secondary" id="tgLink" target="_blank">✈️ Open Telegram Chat</a>
        </div>

        <div class="top-overlay" id="badges"><div class="badge">LIVE</div></div>
        <div class="error-msg" id="errorMsg"></div>
    </div>
    
    <div class="chat-container">
        <div class="chat-header">
            <span>💬 CHAT</span>
            <span id="timerDisplay" style="font-size:11px;color:var(--hint);"></span>
        </div>
        <div class="chat-messages" id="chatBox"></div>
        <div class="input-area">
            <input type="text" class="nick-in" id="userNick" placeholder="Your nickname" maxlength="15">
            <div class="row">
                <input type="text" style="flex:1" id="userMsg" placeholder="Send a message..." maxlength="100">
                <button class="send-btn" onclick="sendMsg()">➤</button>
            </div>
        </div>
    </div>

<script>
    // ⚠️ НАСТРОЙКИ - ЗАМЕНИ ТОЛЬКО ЭТИ 2 СТРОКИ
    const VIDEO_URL = 'https://myprivatestream.b-cdn.net/video.mp4_compross.mp4';
    const TG_USERNAME = 'YOUR_TG_USERNAME'; // Твой ник без @
    const DA_LINK = 'https://donationalerts.com/r/YOUR_LINK'; // Твоя ссылка на оплату
    const FREE_TIME = 30;

    const tg = window.Telegram.WebApp;
    tg.expand(); 

    let sessionId = localStorage.getItem('local_sid');
    if (!sessionId) {
        sessionId = crypto.randomUUID();
        localStorage.setItem('local_sid', sessionId);
    }

    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        document.getElementById('userNick').value = tg.initDataUnsafe.user.first_name;
        document.getElementById('userNick').style.display = 'none';
    }

    window.onload = () => {
        const status = localStorage.getItem('local_status');
        const startTime = localStorage.getItem('local_start_time');
        
        if (status === 'blocked') {
            showPaywall();
        } else if (startTime) {
            const elapsed = Math.floor((Date.now() - parseInt(startTime)) / 1000);
            if (elapsed >= FREE_TIME) {
                localStorage.setItem('local_status', 'blocked');
                showPaywall();
            } else {
                startVideo();
                startTimer(FREE_TIME - elapsed);
            }
        } else {
            document.getElementById('startScreen').style.display = 'flex';
        }
        runBots();
    };

    function joinStream() {
        document.getElementById('startScreen').style.display = 'none';
        localStorage.setItem('local_start_time', Date.now().toString());
        startVideo();
        startTimer(FREE_TIME);
    }

    function startVideo() {
        const v = document.getElementById('streamVideo');
        const errorMsg = document.getElementById('errorMsg');
        
        console.log('Loading video from Bunny.net...');
        errorMsg.innerText = '⏳ Loading video...';
        errorMsg.style.display = 'block';

        v.src = VIDEO_URL;
        v.style.display = 'block';
        
        v.oncanplay = () => {
            console.log('Video loaded successfully!');
            errorMsg.style.display = 'none';
            v.play().catch(e => {
                console.error('Autoplay blocked:', e);
                errorMsg.innerText = '⚠️ Click video to play';
                errorMsg.style.display = 'block';
            });
        };
        
        v.onerror = (e) => {
            console.error('Video load error:', e);
            errorMsg.innerText = '❌ Video failed. Check link in code.';
            errorMsg.style.display = 'block';
        };
        
        document.getElementById('badges').style.opacity = '1';
    }

    function startTimer(sec) {
        let s = sec;
        const el = document.getElementById('timerDisplay');
        const int = setInterval(() => {
            s--; 
            el.innerText = `${s}s left`;
            if(s <= 0) { 
                clearInterval(int); 
                el.innerText = ''; 
                localStorage.setItem('local_status', 'blocked');
                lockStream(); 
            }
        }, 1000);
    }

    function lockStream() {
        const v = document.getElementById('streamVideo');
        v.pause();
        v.style.display = 'none';
        showPaywall();
    }

    function showPaywall() {
        document.getElementById('streamVideo').style.display = 'none';
        document.getElementById('displaySessionId').innerText = sessionId;
        
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        const tgProto = isMobile ? 'tg' : 'https';
        const prefill = encodeURIComponent("Привет! Я оплатил доступ. Session ID: " + sessionId);
        
        document.getElementById('payLink').href = `${DA_LINK}?metadata[sid]=${sessionId}`;
        document.getElementById('tgLink').href = `${tgProto}://resolve?domain=${TG_USERNAME}&text=${prefill}`;
        
        document.getElementById('paywallScreen').style.display = 'flex';
        document.getElementById('badges').style.opacity = '0.3';
    }

    function copySessionId() {
        navigator.clipboard.writeText(sessionId).then(() => {
            const el = document.getElementById('displaySessionId');
            const orig = el.innerText; 
            el.innerText = "Copied!";
            setTimeout(() => el.innerText = orig, 1500);
        });
    }

    const bots = [{n:'Alex',c:''},{n:'Dmitry',c:''},{n:'Sergey',c:''},{n:'Max',c:''}];
    const msgs = ['Write to TG','Check DM','Come to SPB','Sent cash','Check SMS','Nice content','How much?'];
    
    function runBots() {
        setTimeout(()=>{
            const b = bots[Math.floor(Math.random()*bots.length)];
            const m = msgs[Math.floor(Math.random()*msgs.length)];
            render(b.n, m);
            runBots();
        }, Math.random()*4000+2000);
    }

    function sendMsg() {
        const n = document.getElementById('userNick').value.trim() || 'Anon';
        const t = document.getElementById('userMsg').value.trim();
        if(!t) return;
        localStorage.setItem('local_nick', n);
        render(n, t);
        document.getElementById('userMsg').value = '';
    }
    
    document.getElementById('userMsg').onkeypress = e => { if(e.key==='Enter') sendMsg(); };
    if(localStorage.getItem('local_nick')) document.getElementById('userNick').value = localStorage.getItem('local_nick');

    function render(n,t) {
        const d = document.createElement('div'); d.className='msg';
        d.innerHTML = `<span class="name">${n}:</span> ${t}`;
        const box = document.getElementById('chatBox'); 
        box.appendChild(d); 
        box.scrollTop=box.scrollHeight;
        if(box.children.length>50) box.removeChild(box.firstChild);
    }
</script>
</body>
</html>
